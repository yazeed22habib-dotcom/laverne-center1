<!-- ===== Lavern patch: shared bookings + hidden server-side PIN ===== -->
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxIVb1eI8V89fOXAAMt8K-EyPojl7LwXYMU48JSZzTHw79oK7fMNDZ8LKKgz6tvNkKV/exec';
let adminSession = null;

delete DEFAULT_SETTINGS.adminPin;

async function apiGet(action) {
    const r = await fetch(API_URL + '?action=' + action);
    return r.json();
}
async function apiPost(payload) {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
    return r.json();
}

function applyServerData(d) {
    bookings = d.bookings || [];
    blockedDates = d.blocked || [];
}

async function refreshPublic() {
    if (adminSession) return;
    try {
        applyServerData(await apiGet('slots'));
        const m = document.getElementById('booking-modal');
        if (m && m.classList.contains('flex') && !document.getElementById('book-time').value) renderTimeSlots();
    } catch (e) { }
}

function loadSavedState() {
    try {
        const savedSet = localStorage.getItem('lavern_v3_settings');
        if (savedSet) siteSettings = { ...DEFAULT_SETTINGS, ...JSON.parse(savedSet) };
        delete siteSettings.adminPin;
        const savedCats = localStorage.getItem('lavern_v3_categories');
        if (savedCats) categories = JSON.parse(savedCats);
        const savedSrvs = localStorage.getItem('lavern_v3_services');
        if (savedSrvs) services = JSON.parse(savedSrvs);
        const savedPkgs = localStorage.getItem('lavern_v3_packages');
        if (savedPkgs) packagesList = JSON.parse(savedPkgs);
    } catch (err) { console.warn('LocalStorage error fallback:', err); }
}

function persistAll() {
    try {
        const s = { ...siteSettings }; delete s.adminPin;
        localStorage.setItem('lavern_v3_settings', JSON.stringify(s));
        localStorage.setItem('lavern_v3_categories', JSON.stringify(categories));
        localStorage.setItem('lavern_v3_services', JSON.stringify(services));
        localStorage.setItem('lavern_v3_packages', JSON.stringify(packagesList));
    } catch (err) {
        showToast('تنبيه: حجم الصور كبير جداً، يرجى تقليل الدقة', 'error');
    }
    applySettingsToUI();
    renderPackages();
    renderCategoryCards();
    renderServices();
}

const _origOpenBooking = openBookingModal;
openBookingModal = function (...args) {
    _origOpenBooking.apply(null, args);
    refreshPublic();
};

async function submitBooking(e) {
    e.preventDefault();
    const cat = document.getElementById('book-category').value;
    const itemId = document.getElementById('book-service').value;
    const date = document.getElementById('book-date').value;
    const time = document.getElementById('book-time').value;
    const name = document.getElementById('book-name').value.trim();
    const phone = document.getElementById('book-phone').value.trim();

    if (isDateBlocked(date)) { showToast('هذا اليوم مغلق بالكامل من المركز', 'error'); return; }
    if (!time) { showToast('يرجى اختيار الوقت المناسب للموعد', 'error'); return; }

    let itemTitle = '', priceText = '';
    if (cat === 'package') {
        const pkg = packagesList.find(p => p.id === itemId);
        if (pkg) { itemTitle = pkg.title; priceText = `${pkg.offerPrice} د.ل (باقة)`; }
    } else {
        const srv = services.find(s => s.id === itemId);
        if (srv) {
            itemTitle = srv.title;
            priceText = srv.priceType === 'range' ? `من ${srv.priceMin} إلى ${srv.priceMax} د.ل` : (srv.priceType === 'consultation' ? 'السعر أثناء المعاينة' : `${srv.price} د.ل`);
        }
    }

    const btn = document.getElementById('book-submit-btn');
    btn.disabled = true; btn.classList.add('opacity-50');
    try {
        const d = await apiPost({ action: 'book', date, time, name, phone, item: itemTitle, price: priceText });
        if (d.error === 'taken') {
            showToast('عذراً، هذا الموعد حُجز للتو. اختاري وقتاً آخر', 'error');
            await refreshPublic(); renderTimeSlots(); return;
        }
        if (d.error === 'blocked') {
            showToast('هذا اليوم مغلق بالكامل من المركز', 'error');
            await refreshPublic(); renderTimeSlots(); return;
        }
        if (d.error) { showToast('تعذر إتمام الحجز، حاولي مرة أخرى', 'error'); return; }
        applyServerData(d);
    } catch (err) {
        showToast('تعذر الاتصال بالخادم، تأكدي من الإنترنت', 'error'); return;
    } finally {
        btn.disabled = false; btn.classList.remove('opacity-50');
    }

    renderTimeSlots();
    const waText =
        `مرحباً ${siteSettings.brandName} 🌿\n` +
        `أود تأكيد حجز موعد جديد:\n` +
        `👤 الاسم: ${name}\n` +
        `📱 الهاتف: ${phone}\n` +
        `👑 الخدمة/الباقة: ${itemTitle}\n` +
        `💵 السعر: ${priceText}\n` +
        `📅 التاريخ: ${date}\n` +
        `⏰ الوقت: ${time}`;
    const waLink = `https://wa.me/${siteSettings.whatsapp}?text=${encodeURIComponent(waText)}`;

    document.getElementById('booking-summary-box').innerHTML = `
        <div><strong>الاسم:</strong> ${name}</div>
        <div><strong>الخدمة/الباقة:</strong> ${itemTitle}</div>
        <div><strong>السعر:</strong> ${priceText}</div>
        <div><strong>الموعد:</strong> ${date} — الساعة ${time}</div>`;
    document.getElementById('whatsapp-redirect-btn').href = waLink;
    document.getElementById('booking-form-container').classList.add('hidden');
    document.getElementById('booking-success-container').classList.remove('hidden');
}

async function checkAdminPin(e) {
    e.preventDefault();
    const pin = document.getElementById('admin-pin-field').value.trim();
    try {
        const d = await apiPost({ action: 'adminList', pin });
        if (d.error) { showToast('رمز المرور غير صحيح', 'error'); return; }
        adminSession = pin;
        applyServerData(d);
        document.getElementById('admin-pin-screen').classList.add('hidden');
        document.getElementById('admin-panel-screen').classList.remove('hidden');
        switchAdminTab('theme');
    } catch (err) {
        showToast('تعذر الاتصال بالخادم', 'error');
    }
}

const _origCloseAdmin = closeAdminModal;
closeAdminModal = function () {
    _origCloseAdmin();
    adminSession = null;
    refreshPublic();
};

async function adminCall(payload, okMsg) {
    if (!adminSession) { showToast('سجّلي الدخول أولاً', 'error'); return false; }
    try {
        const d = await apiPost({ ...payload, pin: adminSession });
        if (d.error) {
            showToast(d.error === 'auth' ? 'انتهت الجلسة، أعيدي الدخول' : (d.error === 'taken' ? 'هذا الموعد محجوز بالفعل' : 'حدث خطأ، حاولي مجدداً'), 'error');
            return false;
        }
        applyServerData(d);
        renderAdminSchedule();
        if (okMsg) showToast(okMsg);
        return true;
    } catch (err) {
        showToast('تعذر الاتصال بالخادم', 'error');
        return false;
    }
}

async function addBlockedDate() {
    const date = document.getElementById('block-date-input').value;
    const reason = document.getElementById('block-date-reason').value.trim();
    if (!date) { showToast('يرجى اختيار التاريخ أولاً', 'error'); return; }
    if (blockedDates.some(b => b.date === date)) { showToast('هذا التاريخ مغلق بالفعل', 'error'); return; }
    await adminCall({ action: 'blockDate', date, reason }, 'تم إغلاق اليوم بنجاح 🚫');
}

async function unblockDate(idx) {
    const b = blockedDates[idx]; if (!b) return;
    await adminCall({ action: 'unblockDate', date: b.date }, 'تم فتح اليوم وتفعيل الحجز فيه');
}

async function addManualAdminBooking(e) {
    e.preventDefault();
    const form = e.target;
    const name = document.getElementById('man-bk-name').value.trim();
    const srv = services.find(s => s.id === document.getElementById('man-bk-srv').value) || services[0];
    const date = document.getElementById('man-bk-date').value;
    const time = document.getElementById('man-bk-time').value;
    const ok = await adminCall({
        action: 'manualBook', date, time,
        name: name + ' (حجز يدوي)', phone: '',
        item: srv ? srv.title : '', price: srv ? `${srv.price} د.ل` : ''
    }, 'تم قفل الموعد بنجاح ✓');
    if (ok) { form.reset(); renderAdminSchedule(); }
}

async function cancelBooking(idx) {
    const b = bookings[idx]; if (!b || !b.id) return;
    await adminCall({ action: 'cancel', id: b.id }, 'تم إلغاء الموعد وإعادة إتاحته');
}

function fillSecuritySettingsForm() {
    document.getElementById('set-whatsapp').value = siteSettings.whatsapp;
    const p = document.getElementById('set-admin-pin');
    p.value = '';
    p.placeholder = 'رمز جديد (اتركيه فارغاً للإبقاء على الحالي)';
}

async function saveSecurityAndWhatsapp(e) {
    e.preventDefault();
    siteSettings.whatsapp = document.getElementById('set-whatsapp').value.trim().replace('+', '');
    const newPin = document.getElementById('set-admin-pin').value.trim();
    persistAll();
    if (newPin) {
        if (newPin.length < 4) { showToast('الرمز يجب ألا يقل عن 4 خانات', 'error'); return; }
        const ok = await adminCall({ action: 'setPin', newPin }, 'تم تغيير الرمز السري ✓');
        if (ok) { adminSession = newPin; document.getElementById('set-admin-pin').value = ''; }
        return;
    }
    showToast('تم حفظ رقم الواتساب ✓');
}

document.addEventListener('DOMContentLoaded', () => {
    const hint = document.querySelector('#admin-pin-screen p');
    if (hint) hint.textContent = 'أدخلي الرمز السري';
    refreshPublic();
});
</script>

</body>
</html>
